<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Unsaid · 未尽</title>
<!-- PWA:可添加到手机主屏幕,像 App 一样打开 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6B5B95">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="未尽">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root{--plum:#6B5B95;--plum-d:#574a7d;--clay:#E8A87C;--warm:#FAF8F5;--ink:#3A3A44;--gray:#8a8a8a;--line:#e8e3dc;--ok:#2e7d4f;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);}
  .tag{display:none;} /* 顶部说明文字:仅电脑宽屏时显示 */
  /* 手机:整屏铺满,无外壳 */
  .phone{width:100%;height:100%;height:100dvh;max-width:100%;background:var(--warm);display:flex;flex-direction:column;position:relative;overflow:hidden;}
  /* 电脑宽屏:居中显示成一个卡片,方便预览 */
  @media (min-width:640px){
    body{background:linear-gradient(160deg,#3a3550,#5a4f7d 60%,#b98a6e);padding:20px;}
    .tag{display:block;color:#f3eef8;font-size:12px;opacity:.85;text-align:center;max-width:400px;line-height:1.6;margin-bottom:10px;}
    .phone{width:400px;height:760px;max-height:92vh;border-radius:28px;box-shadow:0 22px 56px rgba(0,0,0,.4);border:8px solid #15131c;}
  }
  .screen{flex:1;display:none;flex-direction:column;overflow:hidden;}
  .screen.active{display:flex;}
  .cbody::-webkit-scrollbar{width:0;}
  #s-home{background:linear-gradient(165deg,var(--plum),#8a6f9e 45%,var(--clay));color:#fff;overflow-y:auto;}
  #s-home::-webkit-scrollbar{width:0;}
  #s-home .top{flex:1 0 auto;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;text-align:center;padding:calc(24px + env(safe-area-inset-top)) 30px 8px;}
  .moon{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#f0d9c4);margin-bottom:14px;box-shadow:0 0 42px rgba(255,235,210,.6);flex-shrink:0;}
  .logo{font-family:"Songti SC",serif;font-size:44px;font-weight:700;letter-spacing:6px;}
  .logo-sub{font-size:13px;opacity:.92;margin-top:5px;}
  .fld{width:100%;margin-top:14px;text-align:left;}
  .fld label{font-size:12px;opacity:.9;display:block;margin-bottom:5px;}
  .fld input{width:100%;border:none;border-radius:12px;padding:12px;font-size:15px;background:rgba(255,255,255,.94);color:var(--ink);}
  /* 头像选择 */
  .ava-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
  .ava{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;border:2px solid transparent;background:rgba(255,255,255,.9);transition:.15s;}
  .ava.sel{border-color:#fff;transform:scale(1.12);box-shadow:0 0 12px rgba(255,255,255,.5);}
  .ava.img,.lava.img{background-size:cover;background-position:center;font-size:0;}
  #ava-upload{font-size:26px;color:#6B5B95;font-weight:400;}
  #s-home .bottom{padding:14px 22px calc(22px + env(safe-area-inset-bottom));flex-shrink:0;}
  .btn{background:var(--plum);color:#fff;border:none;border-radius:22px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;width:100%;}
  .btn.clay{background:var(--clay);}
  .consent{font-size:11px;opacity:.85;text-align:center;margin-top:10px;line-height:1.6;}
  #s-home .fld{margin-top:10px;}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);padding-top:calc(12px + env(safe-area-inset-top));}
  .bar .nm{font-size:15px;font-weight:600;}
  .bar .sub2{font-size:10px;color:var(--gray);}
  .bar .back,.bar .menu{color:var(--plum);cursor:pointer;}
  .bar .menu{font-size:20px;}
  .dot{width:7px;height:7px;border-radius:50%;background:#bbb;display:inline-block;}
  .dot.on{background:var(--ok);}
  .cbody{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:11px;background:var(--warm);}
  /* 一行消息:头像 + 气泡 */
  .line{display:flex;gap:8px;max-width:86%;align-items:flex-end;}
  .line.mine{align-self:flex-end;flex-direction:row-reverse;}
  .line.theirs{align-self:flex-start;}
  .lava{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;background:#eee;}
  .msg{padding:10px 13px;border-radius:15px;font-size:14.5px;line-height:1.5;word-break:break-word;}
  .msg.mine{background:var(--plum);color:#fff;border-bottom-right-radius:4px;}
  .msg.theirs{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;}
  .msg .who{font-size:9px;opacity:.55;display:block;margin-bottom:2px;}
  .tip{align-self:center;font-size:10.5px;padding:4px 12px;border-radius:12px;text-align:center;max-width:92%;line-height:1.5;}
  .tip.sys{background:#eef4ff;border:1px solid #cdddff;color:#3b6fe0;}
  .tip.hit{background:#eaf5ea;border:1px solid #bcdcbc;color:var(--ok);}
  .tip.miss{background:#fdf3f2;border:1px solid #f0c9c4;color:#b5544a;}
  .cin{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line);background:#fff;align-items:center;padding-bottom:calc(10px + env(safe-area-inset-bottom));}
  .cin input{flex:1;border:1.5px solid var(--line);border-radius:22px;padding:11px 16px;font-size:15px;background:var(--warm);transition:border-color .15s;}
  .cin input:focus{outline:none;border-color:var(--plum);}
  .snd{min-width:46px;height:46px;border-radius:50%;background:var(--plum);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(107,91,149,.35);transition:transform .12s,background .15s;}
  .snd:hover{background:var(--plum-d);}
  .snd:active{transform:scale(.9);}
  .snd svg{width:22px;height:22px;fill:#fff;}
  .mask{position:absolute;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.25s;z-index:20;}
  .mask.show{opacity:1;pointer-events:auto;}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;transform:translateY(110%);transition:.25s;z-index:21;padding:8px 16px 20px;}
  .sheet.show{transform:translateY(0);}
  .grip{width:38px;height:4px;background:#ddd;border-radius:2px;margin:8px auto 12px;}
  .item{padding:14px 6px;font-size:15px;border-bottom:1px solid #f2efe9;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
  .item:last-child{border-bottom:none;}
  .item .d{font-size:11px;color:var(--gray);}
</style>
</head>
<body>
  <div class="tag"><b>Unsaid · 未尽(联网版)</b>　两人各自打开、填同一房间号即可实时聊天,记录存服务器。</div>
  <div class="phone">
    <div class="screen active" id="s-home">
      <div class="top">
        <div class="moon"></div>
        <div class="logo">未尽</div>
        <div class="logo-sub">陪你把没说完的话说完</div>
        <div class="fld"><label>你的昵称</label><input id="me" placeholder="例如:小鹿"></div>
        <div class="fld"><label>选个头像</label>
          <div class="ava-row" id="ava-row">
            <div class="ava sel" data-a="🐰">🐰</div>
            <div class="ava" data-a="🐻">🐻</div>
            <div class="ava" data-a="🐱">🐱</div>
            <div class="ava" data-a="🦊">🦊</div>
            <div class="ava" data-a="🐼">🐼</div>
            <div class="ava" data-a="🌙">🌙</div>
            <div class="ava" data-a="⭐">⭐</div>
            <div class="ava" data-a="🌷">🌷</div>
            <div class="ava" id="ava-upload" title="上传照片">＋</div>
          </div>
          <input type="file" id="ava-file" accept="image/*" style="display:none">
        </div>
        <div class="fld"><label>房间号(两人填一样)</label><input id="room" placeholder="例如:xiaolu-2026"></div>
        <div class="fld"><label>房间密码(两人填一样)</label><input id="pw" type="password" placeholder="首次进入即设为密码"></div>
      </div>
      <div class="bottom">
        <button class="btn clay" onclick="enter()">进入聊天</button>
        <div class="consent">两个人填同一个房间号,就能实时聊。消息保存在你们自己的服务器上。</div>
      </div>
    </div>
    <div class="screen" id="s-chat">
      <div class="bar">
        <span class="back" onclick="location.reload()">← 退出</span>
        <div style="text-align:center;"><div class="nm" id="c-title">房间</div><div class="sub2"><span class="dot" id="conn-dot"></span> <span id="conn-txt">连接中…</span></div></div>
        <span class="menu" onclick="openMenu()">⋯</span>
      </div>
      <div class="cbody" id="cbody"></div>
      <div class="cin"><input id="ci" placeholder="发消息…"><button class="snd" onclick="send()" aria-label="发送"><svg viewBox="0 0 24 24"><path d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a1 1 0 00-1.4.92V9.5c0 .5.37.92.87.98L15 12 2.87 13.52a1 1 0 00-.87.98v4.98a1 1 0 001.4.92z"/></svg></button></div>
    </div>
    <div class="screen" id="s-mem">
      <div class="bar"><span class="back" onclick="showScreen('s-chat')">← 返回</span><div style="text-align:center;"><div class="nm" id="mem-title">回忆</div><div class="sub2">用真实记录 · 非真人</div></div><span style="width:24px"></span></div>
      <div class="cbody" id="mbody"></div>
      <div class="cin"><input id="mi" placeholder="说点什么…"><button class="snd" onclick="memSend()" aria-label="发送"><svg viewBox="0 0 24 24"><path d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a1 1 0 00-1.4.92V9.5c0 .5.37.92.87.98L15 12 2.87 13.52a1 1 0 00-.87.98v4.98a1 1 0 001.4.92z"/></svg></button></div>
    </div>
    <div class="mask" id="mask" onclick="closeMenu()"></div>
    <div class="sheet" id="sheet">
      <div class="grip"></div>
      <div class="item" onclick="enterMem()"><span>💭 切换成"回忆模式"</span><span class="d">用已攒记录对话</span></div>
      <div class="item" onclick="showStats()"><span>📊 这段时间的记录</span><span class="d" id="cnt">—</span></div>
      <div class="item" onclick="logout()"><span style="color:#b5544a">🚪 退出登录 / 换房间</span><span class="d">回到首页</span></div>
      <div class="item" onclick="closeMenu()"><span style="color:var(--gray)">关闭</span></div>
    </div>
  </div>

<script>
var ME="", ROOM="", TA="TA", ws=null, messages=[];
var MY_AVA="🐰";              // 我选的头像
var avatarMap={};              // uid -> 头像
var DEFAULT_AVA="💬";
var MY_UID="";
// 身份标识 = 房间号 + 名称。同房间同名视为同一人;换设备只要名称/房间/密码一致即同一身份。
function makeUid(room, name){ return room + '::' + name; }

// 头像选择器(emoji)
document.getElementById('ava-row').addEventListener('click', function(e){
  var el=e.target.closest('.ava'); if(!el) return;
  if(el.id==='ava-upload'){ document.getElementById('ava-file').click(); return; }
  this.querySelectorAll('.ava').forEach(function(a){a.classList.remove('sel');});
  el.classList.add('sel'); MY_AVA=el.getAttribute('data-a');
});
// 上传照片当头像:压缩成 96px 方形 jpeg,base64 存储
document.getElementById('ava-file').addEventListener('change', function(e){
  var f=e.target.files[0]; if(!f) return;
  var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var S=96, cv=document.createElement('canvas'); cv.width=S; cv.height=S;
      var ctx=cv.getContext('2d');
      // 居中裁剪成正方形
      var side=Math.min(img.width,img.height), sx=(img.width-side)/2, sy=(img.height-side)/2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, S, S);
      var data=cv.toDataURL('image/jpeg', 0.8);
      MY_AVA=data;
      // 在上传按钮位置显示预览并选中
      var up=document.getElementById('ava-upload');
      document.querySelectorAll('#ava-row .ava').forEach(function(a){a.classList.remove('sel');});
      applyAva(up, data); up.classList.add('sel');
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(f);
});

// 登录信息本地持久化(刷新自动进入)
function saveSession(){
  try{ localStorage.setItem('unsaid_session', JSON.stringify({me:ME,room:ROOM,pw:PW,ava:MY_AVA})); }catch(e){}
}
function clearSession(){ try{ localStorage.removeItem('unsaid_session'); }catch(e){} }
function loadSession(){ try{ return JSON.parse(localStorage.getItem('unsaid_session')||'null'); }catch(e){ return null; } }

var PW="";
function enter(){
  ME=(document.getElementById('me').value||'我').trim();
  ROOM=(document.getElementById('room').value||'').trim();
  PW=(document.getElementById('pw').value||'');
  if(!ROOM){ alert('请填房间号,两人要一致'); return; }
  if(!PW){ alert('请填房间密码,两人要一致'); return; }
  startSession();
}
// 真正进入(可被自动登录复用)
function startSession(){
  MY_UID = makeUid(ROOM, ME);               // 身份 = 房间+名称
  avatarMap[MY_UID]=MY_AVA;                 // 我的头像按 uid 记
  document.getElementById('c-title').textContent='房间:'+ROOM;
  showScreen('s-chat');
  document.getElementById('cbody').innerHTML='';
  connect();
}
// 退出登录 / 换房间
function logout(){
  clearSession();
  try{ if(ws) ws.close(); }catch(e){}
  ws=null; messages=[]; avatarMap={}; peers={};
  document.getElementById('cbody').innerHTML='';
  closeMenu();
  showScreen('s-home');
}
function connect(){
  var proto = location.protocol==='https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto+'://'+location.host);
  ws.onopen=function(){ setConn(true); ws.send(JSON.stringify({type:'join', room:ROOM, name:ME, avatar:MY_AVA, uid:MY_UID, pw:PW})); };
  ws.onclose=function(){ setConn(false); setTimeout(connect, 2000); };
  ws.onerror=function(){ setConn(false); };
  ws.onmessage=function(ev){
    var m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    if(m.type==='join_denied'){
      var why, tip;
      if(m.reason==='name_taken'){ why='这个名称已被占用'; tip='房间里已有人用了「'+ME+'」这个名字,请换一个不同的名称再进。'; }
      else if(m.reason==='wrong_pw'){ why='房间密码不对'; tip='该房间号已存在,请与对方核对密码;或换一个新房间号(将由你设定密码)。'; }
      else if(m.reason==='no_pw'){ why='请填写密码'; tip=''; }
      else { why='房间信息有误'; tip=''; }
      try{ ws.close(); }catch(e){}
      ws=null;
      clearSession();               // 进入失败,清掉可能存错的会话,避免自动登录死循环
      showScreen('s-home');
      alert('进入失败:'+why+'。\n'+tip);
      return;
    }
    if(m.type==='join_ok'){
      saveSession();                // 进入成功,记住登录信息,下次刷新自动进
      if(m.created){ addTip('房间已创建,你设定了密码。把房间号和密码告诉对方即可一起进来。','sys'); }
      return;
    }
    if(m.type==='history'){
      messages=[]; document.getElementById('cbody').innerHTML='';
      addTip('已进入房间「'+ROOM+'」。让对方也用同一房间号进来,就能实时聊了。','sys');
      (m.messages||[]).forEach(function(x){ pushMsg(x.sender, x.text, x.ts, x.avatar, x.uid); });
    } else if(m.type==='msg'){ pushMsg(m.sender, m.text, m.ts, m.avatar, m.uid);
    } else if(m.type==='members'){ (m.members||[]).forEach(function(mm){ learnAvatar(mm.uid, mm.avatar); if(mm.uid!==MY_UID){ peers[mm.uid]=mm.name; } }); refreshAvatars(); updatePresence();
    } else if(m.type==='presence'){ learnAvatar(m.uid, m.avatar); if(m.uid!==MY_UID){ peers[m.uid]=m.name; } refreshAvatars(); updatePresence();
    } else if(m.type==='offline'){ delete peers[m.uid]; updatePresence(); }
  };
}
// 记录在线的"对方"(uid->name),据此显示在线状态
var peers={};
function updatePresence(){
  var names=Object.keys(peers).map(function(u){return peers[u];});
  var el=document.getElementById('conn-txt');
  var dot=document.getElementById('conn-dot');
  if(!ws || ws.readyState!==1){ if(el)el.textContent='连接中…'; if(dot)dot.className='dot'; return; }
  if(names.length>0){
    if(el) el.textContent = names.join('、')+' 在线';
    if(dot) dot.className='dot on';
  } else {
    if(el) el.textContent = '对方不在线';
    if(dot) dot.className='dot';   // 灰点=对方不在
  }
}
// 记住某 uid 的头像(不覆盖自己的本地选择,不被默认💬覆盖已知头像)
function learnAvatar(uid, avatar){
  if(!uid || !avatar) return;
  if(uid===MY_UID){ avatarMap[MY_UID]=MY_AVA; return; }
  if(avatar!=='💬' || !avatarMap[uid]) avatarMap[uid]=avatar;
}
// 刷新已渲染气泡的头像(对方头像后到时,更新历史消息的显示)
function refreshAvatars(){
  document.querySelectorAll('#cbody .lava').forEach(function(el){
    var key=el.getAttribute('data-key'); var mine=el.getAttribute('data-mine')==='1';
    applyAva(el, mine ? MY_AVA : (avatarMap[key] || DEFAULT_AVA));
  });
}
function setConn(ok){
  if(!ok){ peers={}; document.getElementById('conn-dot').className='dot'; document.getElementById('conn-txt').textContent='连接中…'; }
  else { updatePresence(); }
}
// 判断是否是"我":优先用 uid;老消息没有 uid 时,退回按昵称判断
function isMine(uid, sender){
  if(uid) return uid===MY_UID;
  return sender===ME;
}
function pushMsg(sender, text, ts, avatar, uid){
  var mine = isMine(uid, sender);
  var key = uid || sender;                       // 头像索引:优先 uid,没有则用昵称
  // 只在"非我、且带头像"时更新映射;我自己的头像始终以本地选择为准,不被老💬覆盖
  if(mine){ avatarMap[MY_UID]=MY_AVA; }
  else if(avatar && avatar!=='💬'){ avatarMap[key]=avatar; }
  else if(!avatarMap[key]){ avatarMap[key]=avatar||DEFAULT_AVA; }
  messages.push({sender:sender, text:text, ts:ts, mine:mine});
  if(!mine) TA=sender;
  render(sender, text, mine, key);
  document.getElementById('cnt').textContent=messages.length+' 条';
}
function avaOf(mine, key){ return mine ? MY_AVA : (avatarMap[key] || DEFAULT_AVA); }
// 把头像值渲染到元素:data:开头当图片(背景),否则当 emoji 文字
function applyAva(el, val){
  if(val && val.indexOf('data:')===0){ el.classList.add('img'); el.style.backgroundImage='url('+val+')'; el.textContent=''; }
  else { el.classList.remove('img'); el.style.backgroundImage=''; el.textContent=val||DEFAULT_AVA; }
}
function render(sender, text, mine, key){
  var b=document.getElementById('cbody');
  var line=document.createElement('div'); line.className='line '+(mine?'mine':'theirs');
  var av=document.createElement('div'); av.className='lava'; applyAva(av, avaOf(mine, key));
  av.setAttribute('data-key', key); av.setAttribute('data-mine', mine?'1':'0');
  var d=document.createElement('div'); d.className='msg '+(mine?'mine':'theirs');
  var w=document.createElement('span'); w.className='who'; w.textContent=sender;
  d.appendChild(w); d.appendChild(document.createTextNode(text));
  line.appendChild(av); line.appendChild(d);
  b.appendChild(line); b.scrollTop=b.scrollHeight;
}
function addTip(t,k){var b=document.getElementById('cbody');var d=document.createElement('div');d.className='tip '+(k||'sys');d.textContent=t;b.appendChild(d);b.scrollTop=b.scrollHeight;}
function send(){
  var inp=document.getElementById('ci'), t=inp.value.trim(); if(!t) return;
  if(!ws || ws.readyState!==1){ alert('还没连上服务器,请稍候'); return; }
  ws.send(JSON.stringify({type:'msg', text:t})); inp.value='';
}
// 回车发送:输入法组字中(isComposing)不触发,避免英文/中文候选回车重复
function bindEnter(inputId, fn){
  var el=document.getElementById(inputId); var composing=false;
  el.addEventListener('compositionstart', function(){ composing=true; });
  el.addEventListener('compositionend', function(){ composing=false; });
  el.addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey && !composing && !e.isComposing){ e.preventDefault(); fn(); }
  });
}
function openMenu(){document.getElementById('sheet').classList.add('show');document.getElementById('mask').classList.add('show');}
function closeMenu(){document.getElementById('sheet').classList.remove('show');document.getElementById('mask').classList.remove('show');}
function showStats(){var mine=messages.filter(m=>m.mine).length;var ta=messages.length-mine;closeMenu();alert('已攒 '+messages.length+' 条\n你 '+mine+' 条 / 对方 '+ta+' 条\n\n对方的话越多,回忆模式越像 TA(需≥3条)');}

var pairs=[], taLines=[], fbi=0, fb=['我一时不知道该怎么接…但我在听着呢。','这个我们好像没聊过,可你说,我都想听。','嗯…(想了想)再多说点?'];
function buildPairs(){pairs=[];taLines=[];for(var i=0;i<messages.length;i++){if(!messages[i].mine){taLines.push(messages[i].text);var q=(i>0&&messages[i-1].mine)?messages[i-1].text:'';pairs.push({q:q,a:messages[i].text});}}}
function enterMem(){closeMenu();buildPairs();if(taLines.length<3){alert('对方的消息还太少('+taLines.length+'条),再多聊聊');return;}document.getElementById('mem-title').textContent=TA+'(回忆)';showScreen('s-mem');document.getElementById('mbody').innerHTML='';memTip('已载入你们 '+pairs.length+' 组对话。说点什么,我会用 '+TA+' 说过的话回你。','sys');setTimeout(function(){memBubble(pairs[0]?pairs[0].a:taLines[0],'ta');},250);}
function clean(s){return (s||'').replace(/[\s,。,.!！?？、~…"''：:;；()（）]/g,'');}
function grams(s,n){s=clean(s);var g={};if(s.length<n){if(s)g[s]=1;return g;}for(var i=0;i<=s.length-n;i++)g[s.substr(i,n)]=1;return g;}
function jac(ga,gb){var ka=Object.keys(ga),kb=Object.keys(gb);if(!ka.length||!kb.length)return 0;var n=0;ka.forEach(function(k){if(gb[k])n++;});return n/(ka.length+kb.length-n);}
function sim(a,b){return 0.65*jac(grams(a,2),grams(b,2))+0.35*jac(grams(a,1),grams(b,1));}
function retrieve(input){var best=null,bs=0;pairs.forEach(function(p){if(!p.q)return;var s=sim(input,p.q);if(s>bs){bs=s;best=p;}});if(!best){taLines.forEach(function(t){var s=sim(input,t);if(s>bs){bs=s;best={q:'',a:t};}});}return{pair:best,score:bs};}
function memBubble(t,w){var b=document.getElementById('mbody');var d=document.createElement('div');d.className='msg '+(w==='me'?'mine':'theirs');d.textContent=t;b.appendChild(d);b.scrollTop=b.scrollHeight;}
function memTip(t,k){var b=document.getElementById('mbody');var d=document.createElement('div');d.className='tip '+(k||'sys');d.textContent=t;b.appendChild(d);b.scrollTop=b.scrollHeight;}
// 纯检索回退(无大模型或大模型失败时用)
function memRetrieveReply(t){
  var r=retrieve(t);
  if(r.pair&&r.score>=0.12){
    var pct=Math.round(r.score*100);
    if(r.pair.q)memTip('🔎 你曾说过"'+r.pair.q+'"(相近 '+pct+'%)→ '+TA+' 当时这样回','hit');
    else memTip('📎 引用 '+TA+' 说过的话(相近 '+pct+'%)','hit');
    memBubble(r.pair.a,'ta');
  } else {
    memBubble(fb[fbi%fb.length],'ta');fbi++;
    memTip('⚠ 记录里没有相近的话 —— 纯检索的局限','miss');
  }
}
// 把回忆用到的对话整理成 {who:'me'|'ta',text}(相对回忆发起者)
function memMessages(){
  return messages.map(function(m){ return {who: m.mine?'me':'ta', text:m.text}; });
}
function memSend(){
  var inp=document.getElementById('mi'),t=inp.value.trim();if(!t)return;
  memBubble(t,'me');inp.value='';
  if(/不想活|自杀|活不下去|结束自己|轻生/.test(t)){
    setTimeout(function(){memTip('⚠ 安全提醒(非检索结果)','sys');memBubble('我有点担心你。我只是基于记忆的程序,接不住这些——但你值得被真正接住。如果难受,请联系信任的人或拨打心理援助热线。','ta');},400);
    return;
  }
  // 先尝试大模型润色;失败/未配置则回退纯检索
  var typing=setTimeout(function(){ memTip((TA+' 正在回忆…'),'sys'); }, 250);
  fetch('/memory-reply',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({taName:TA, input:t, messages:memMessages()})
  }).then(function(r){return r.json();}).then(function(j){
    clearTimeout(typing);
    if(j && j.mode==='llm' && j.reply){ memBubble(j.reply,'ta'); }
    else { memRetrieveReply(t); }   // retrieval / error 都回退本地检索
  }).catch(function(){ clearTimeout(typing); memRetrieveReply(t); });
}

function showScreen(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});document.getElementById(id).classList.add('active');}

// 绑定回车发送(带输入法保护),替代原来的 inline onkeydown
bindEnter('ci', send);
bindEnter('mi', memSend);

// 自动登录:本机存过会话就直接进聊天,不用重填
(function autoLogin(){
  var s=loadSession();
  if(s && s.room && s.me && s.pw){
    ME=s.me; ROOM=s.room; PW=s.pw; MY_AVA=s.ava||MY_AVA;
    // 同步首页表单(万一自动登录失败退回首页,字段已填好)
    var meEl=document.getElementById('me'), roomEl=document.getElementById('room'), pwEl=document.getElementById('pw');
    if(meEl) meEl.value=ME; if(roomEl) roomEl.value=ROOM; if(pwEl) pwEl.value=PW;
    startSession();
  }
})();
</script>
